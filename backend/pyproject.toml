[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "academia-backend"
version = "0.1.0"
description = "Infraestrutura do monólito modular para academias e Pilates"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<7",
  "celery[redis]>=5.4,<6",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: exige PostgreSQL e Redis reais"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
