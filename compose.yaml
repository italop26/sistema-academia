x-backend: &backend
  build:
    context: ./backend
    target: runtime
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
  init: true
  volumes:
    - sqlite_data:/app/data

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Execute node scripts/setup-env.mjs}
      POSTGRES_USER: ${POSTGRES_USER:?Execute node scripts/setup-env.mjs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    <<: *backend
    command: [celery, -A, app.core.celery_app:celery_app, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    <<: *backend
    command: [celery, -A, app.core.celery_app:celery_app, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:?Defina VITE_API_URL}
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      backend:
        condition: service_healthy

  tests:
    <<: *backend
    profiles: [tools]
    build:
      context: ./backend
      target: test
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RUN_INTEGRATION_TESTS: "1"
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  sqlite_data:
  postgres_data:
  redis_data:
