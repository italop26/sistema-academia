# Usar exclusivamente com -p academia-validation e --env-file .env.validation.
x-validation: &validation
  env_file: !override [.env.validation]
  environment: &validation-env
    APP_ENV: test
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    DATABASE_URL: sqlite+pysqlite:///./data/validation.db
    VALIDATION_ONLY: "1"

services:
  postgres:
    ports: !override ["127.0.0.1:15432:5432"]
  redis:
    ports: !override ["127.0.0.1:16379:6379"]
  migrate:
    <<: *validation
    image: academia-validation-backend
  backend:
    <<: *validation
    ports: !override ["127.0.0.1:18000:8000"]
  worker:
    <<: *validation
    image: academia-validation-backend
  scheduler:
    <<: *validation
    image: academia-validation-backend
  frontend:
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://backend:8000
    ports: !override ["127.0.0.1:15173:5174"]
  tests:
    <<: *validation
    environment:
      <<: *validation-env
      RUN_INTEGRATION_TESTS: "1"
  seed:
    <<: *validation
    profiles: [tools]
    build:
      context: ./backend
      target: test
    command: [python, tests/seed_e2e.py]
    volumes:
      - sqlite_data:/app/data
    depends_on:
      backend:
        condition: service_healthy
  e2e:
    profiles: [tools]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    init: true
    shm_size: 1gb
    environment:
      E2E_BASE_URL: http://frontend:5174
      E2E_CREDENTIALS: /test-data/e2e-credentials.json
    volumes:
      - sqlite_data:/test-data:ro
      - ./frontend/test-results:/artifacts
    depends_on:
      frontend:
        condition: service_started
